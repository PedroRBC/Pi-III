<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Padrão Material 3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:412px;height:915px;overflow:hidden}
body{font-family:Roboto,system-ui,sans-serif;background:#FEF7FF;color:#1D1B20}
.top{padding:44px 16px 12px;display:flex;align-items:center}
.top h1{font-size:22px;font-weight:400;flex:1}
.top i{width:24px;height:24px;border-radius:50%;background:#E8DEF8}
.card{margin:8px 16px;border-radius:12px;background:#F3EDF7;padding:16px}
.state{background:#E8DEF8}
.state small{font-size:12px;color:#49454F;letter-spacing:.5px}
.state b{display:block;font-size:28px;font-weight:400;margin:8px 0 4px}
.state p{font-size:14px;color:#49454F}
.item{display:flex;align-items:center;padding:14px 16px;gap:16px}
.ic{width:40px;height:40px;border-radius:50%;background:#EADDFF}
.tx{flex:1}.tx b{font-size:16px;font-weight:400;display:block}.tx span{font-size:14px;color:#49454F}
.v{font-size:16px}
.chart svg{width:100%;height:120px}
.fab{position:absolute;right:16px;bottom:32px;height:56px;padding:0 20px;border-radius:16px;background:#EADDFF;display:flex;align-items:center;font-size:14px;font-weight:500;color:#21005D}
</style></head><body>
<div class="top"><h1>Detector de Gases</h1><i></i></div>
<div class="card state"><small>CONECTADO</small><b>Ar normal</b><p>Nenhum gás detectado</p></div>
<div class="item"><div class="ic"></div><div class="tx"><b>Gás e fumaça</b><span>MQ-2</span></div><div class="v">212</div></div>
<div class="item"><div class="ic"></div><div class="tx"><b>Qualidade do ar</b><span>MQ-135</span></div><div class="v">168</div></div>
<div class="item"><div class="ic"></div><div class="tx"><b>Temperatura</b><span>LM35</span></div><div class="v">25,5 °C</div></div>
<div class="card chart"><svg viewBox="0 0 360 120"><polyline fill="none" stroke="#6750A4" stroke-width="3" points="0,95 60,92 120,88 170,60 210,55 250,90 360,92"/></svg></div>
<div class="fab">Desconectar</div>
</body></html>
